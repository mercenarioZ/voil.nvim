name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NVIM_VERSION: v0.12.4
      JJ_VERSION: v0.44.0
    steps:
      - uses: actions/checkout@v4

      - name: install neovim
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/nvim.tar.gz -C /opt
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          nvim --version | head -1

      - name: install jj
        run: |
          curl -fsSL -o /tmp/jj.tar.gz \
            "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/jj.tar.gz -C /tmp
          sudo install -m 755 /tmp/jj /usr/local/bin/jj
          jj --version

      - name: clone oil.nvim
        run: git clone --depth 1 https://github.com/stevearc/oil.nvim "$RUNNER_TEMP/oil.nvim"

      - name: run tests
        env:
          OIL_NVIM_PATH: ${{ runner.temp }}/oil.nvim
        run: bash tests/run.sh
